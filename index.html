<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>re:market</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAACXBIWXMAAA7DAAAOwwHHb6hkAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAABW1JREFUeJzt3UEOAjEQBUDq/r9v8c37a6bS2U1Q0u4z/7Q0Sfv1+/1+vwEAAL4R4YqfS2T59qNq0a6/4i//K/5P2u4v+T9bu5+6831pQ/+2D8Y/P+O91v//vQYmX2vP6P2K77q9Pfv0/w8/1+wL9v//j9z+P6p/W+XzX3f7Kq627P3v+/n6v2P09z531v6Vn7tP/b5/x/2T9r5r431jP7oP2b/v8n3Xv8P0O/7n3P/13/f7x8A8N8f97//a3P/d5+9z5f//e91P1v+v8/5t/z+W//xP///8z/8jAAB//wA==">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        apple: { light: '#fbfbfd', gray: '#86868b', dark: '#1d1d1f', blue: '#0071e3' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fbfbfd; color: #1d1d1f; overflow-x: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        a, button, input, select, .product-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; background: #fbfbfd; }
        .fluid-shape { position: absolute; filter: blur(60px); opacity: 0.6; animation: fluidRotate 30s infinite linear; }
        .shape-1 { width: 70vw; height: 70vw; background: linear-gradient(135deg, rgba(0,113,227,0.5) 0%, rgba(90,200,250,0.3) 100%); top: -20%; left: -10%; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        .shape-2 { width: 60vw; height: 60vw; background: linear-gradient(135deg, rgba(175,82,222,0.4) 0%, rgba(255,45,85,0.2) 100%); bottom: -20%; right: -10%; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        .bg-glass-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; backdrop-filter: blur(80px) saturate(150%); -webkit-backdrop-filter: blur(80px) saturate(150%); background: rgba(251, 251, 253, 0.5); pointer-events: none; }
        .glass-pill { background: rgba(255, 255, 255, 0.4); backdrop-filter: saturate(220%) blur(30px); -webkit-backdrop-filter: saturate(220%) blur(30px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 15px 35px -10px rgba(0,113,227,0.12); }
        .liquid-btn { background: rgba(255, 255, 255, 0.45); backdrop-filter: saturate(200%) blur(25px); -webkit-backdrop-filter: saturate(200%) blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); color: #1d1d1f; }
        .liquid-btn:hover { background: rgba(255, 255, 255, 0.75); transform: scale(1.03); }
        .liquid-btn-dark { background: rgba(29, 29, 31, 0.85); backdrop-filter: saturate(200%) blur(25px); -webkit-backdrop-filter: saturate(200%) blur(25px); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; }
        .liquid-btn-dark:hover { background: rgba(0, 0, 0, 0.95); transform: scale(1.03); }
        .glass { background: rgba(255, 255, 255, 0.6); backdrop-filter: saturate(180%) blur(25px); -webkit-backdrop-filter: saturate(180%) blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .glass-heavy { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(200%) blur(30px); -webkit-backdrop-filter: saturate(200%) blur(30px); border: 1px solid rgba(255, 255, 255, 1); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .chat-panel { transform: translateY(20px); opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .chat-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="antialiased">

    <div class="animated-bg">
        <div class="fluid-shape shape-1"></div>
        <div class="fluid-shape shape-2"></div>
    </div>
    <div class="bg-glass-overlay"></div>

    <nav class="fixed top-0 w-full z-50 glass transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 flex items-center cursor-pointer text-apple-dark">
                    <i class="ph-fill ph-apple text-3xl"></i>
                    <span class="ml-2 font-sans font-extrabold text-2xl tracking-tighter">re:market</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleCart()" class="relative p-2.5 rounded-full liquid-btn text-apple-dark">
                        <i class="ph ph-shopping-bag text-xl"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 bg-apple-blue text-white text-xs font-bold rounded-full h-4 w-4 flex items-center justify-center opacity-0 transition-opacity">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-48 pb-24 text-center">
        <h1 class="text-5xl md:text-7xl font-bold tracking-tight text-apple-dark mb-6">
            Кристально <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-apple-blue to-purple-500">чисто.</span>
        </h1>
        <p class="mt-4 text-xl text-gray-600 max-w-2xl mx-auto font-light">
            Безупречный дизайн. Невероятная мощь. Ощутите эстетику технологий в каждом прикосновении.
        </p>
        <div class="mt-10">
            <a href="#products" class="liquid-btn-dark px-8 py-3.5 rounded-full font-medium shadow-xl inline-block">В каталог</a>
        </div>
    </main>

    <section id="products" class="py-24 relative z-10 max-w-7xl mx-auto px-4">
        <h2 class="text-3xl md:text-4xl font-bold text-apple-dark mb-10 text-center">Шедевры инженерии.</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="products-grid"></div>
    </section>

    <div id="cart-overlay" class="fixed inset-0 bg-white/30 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[420px] glass-heavy z-50 transform translate-x-full transition-transform duration-500 shadow-2xl flex flex-col">
        <div class="p-6 border-b border-gray-200/50 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-apple-dark">Ваша корзина</h2>
            <button onclick="toggleCart()" class="text-gray-500 liquid-btn rounded-full p-2.5"><i class="ph ph-x text-xl"></i></button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-4">
            <div class="text-center text-gray-400 mt-20"><p class="text-lg text-apple-dark font-medium">Корзина пуста</p></div>
        </div>
        <div class="p-6 border-t border-gray-200/50 bg-white/50 backdrop-blur-md">
            <div class="flex justify-between items-center mb-6"><span class="text-gray-500 text-lg">Итого:</span><span class="text-apple-dark text-3xl font-bold" id="cart-total">0 ₽</span></div>
            <button onclick="checkout()" class="w-full liquid-btn-dark py-4 rounded-2xl font-semibold text-lg shadow-lg">Оформить заказ</button>
        </div>
    </div>

    <div id="toast" class="toast glass-heavy px-6 py-4 rounded-2xl border border-white shadow-xl flex items-center gap-3">
        <i class="ph-fill ph-check-circle text-apple-blue text-2xl"></i>
        <span class="text-apple-dark font-medium" id="toast-msg">Товар добавлен</span>
    </div>

    <footer class="border-t border-gray-200/50 mt-20 py-20 text-center glass relative z-10">
        <p class="font-sans font-extrabold text-5xl text-apple-dark tracking-tighter">re:market</p>
        <p class="mt-2 text-xs tracking-[0.3em] text-gray-400 font-bold uppercase">улица Темерницкая, 74 | город Ростов-на-Дону</p>
    </footer>

    <script>
        const products = [
            { id: 'iphone15pro', name: 'iPhone 15 Pro', desc: 'Титановый корпус. Чип A17 Pro.', price: 119990, prefix: 'от', img: 'https://images.unsplash.com/photo-1696446700622-81e83f23a1d9?q=80&w=800&auto=format&fit=crop' },
            { id: 'macbookpro16', name: 'MacBook Pro 16"', desc: 'M3 Max. Невероятная мощь.', price: 349990, prefix: 'от', img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=800&auto=format&fit=crop' },
            { id: 'ipadpro', name: 'iPad Pro', desc: 'Тонкий. Легкий. Эпичный.', price: 99990, prefix: 'от', img: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?q=80&w=800&auto=format&fit=crop' }
        ];

        let cart = [];
        let isCartOpen = false;

        function formatPrice(price) { return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽"; }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            grid.innerHTML = '';
            products.forEach(product => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="glass rounded-[2rem] p-8 flex flex-col justify-between h-[450px]">
                        <div class="text-center">
                            <h3 class="text-2xl font-semibold text-apple-dark">${product.name}</h3>
                            <p class="text-sm text-gray-500 mt-2">${product.desc}</p>
                            <p class="text-lg font-medium text-apple-dark mt-4">${product.prefix} ${formatPrice(product.price)}</p>
                        </div>
                        <div class="flex-grow flex items-center justify-center my-4">
                            <img src="${product.img}" alt="${product.name}" class="w-40 h-auto object-contain rounded-xl shadow-lg">
                        </div>
                        <button onclick="addToCart('${product.id}', '${product.name}', ${product.price}, '${product.img}')" class="w-full py-3.5 liquid-btn-dark rounded-full font-medium shadow-md">В корзину</button>
                    </div>
                `);
            });
        }
        renderProducts();

        window.addToCart = function(id, name, price, img) {
            const item = cart.find(i => i.id === id);
            if (item) item.quantity++; else cart.push({ id, name, price, img, quantity: 1 });
            updateCartUI();
            showToast(`${name} добавлен в корзину`);
        };

        window.removeFromCart = function(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); };

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            let totalCount = 0, totalPrice = 0;

            cart.forEach(i => { totalCount += i.quantity; totalPrice += i.price * i.quantity; });
            badge.textContent = totalCount;
            badge.style.opacity = totalCount > 0 ? '1' : '0';
            totalEl.textContent = formatPrice(totalPrice);

            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 mt-20"><p class="text-lg text-apple-dark font-medium">Корзина пуста</p></div>';
            } else {
                container.innerHTML = '';
                cart.forEach(i => {
                    container.insertAdjacentHTML('beforeend', `
                        <div class="flex items-center gap-4 bg-white/60 p-3 rounded-2xl border border-white shadow-sm">
                            <img src="${i.img}" class="w-16 h-16 object-cover rounded-xl">
                            <div class="flex-grow">
                                <h4 class="text-apple-dark font-semibold text-sm">${i.name}</h4>
                                <div class="text-apple-blue font-medium text-sm">${formatPrice(i.price)} × ${i.quantity}</div>
                            </div>
                            <button onclick="removeFromCart('${i.id}')" class="text-gray-400 hover:text-red-500 p-2"><i class="ph ph-trash text-xl"></i></button>
                        </div>
                    `);
                });
            }
        }

        window.toggleCart = function() {
            isCartOpen = !isCartOpen;
            document.getElementById('cart-sidebar').style.transform = isCartOpen ? 'translateX(0)' : 'translateX(100%)';
            document.getElementById('cart-overlay').classList.toggle('hidden', !isCartOpen);
            setTimeout(() => document.getElementById('cart-overlay').classList.toggle('opacity-0', !isCartOpen), 10);
        };

        window.checkout = function() {
            if (cart.length === 0) return;
            cart = [];
            updateCartUI();
            toggleCart();
            showToast("Заказ успешно оформлен!");
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
