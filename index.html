<script>
        let cart = [], isCartOpen = false, isRegisterMode = false;
        let allProducts = [], filteredProducts = [], currentPage = 1, currentActiveCategory = 'Все', currentSort = null;
        
        // Устанавливаем 12 товаров на страницу
        const itemsPerPage = 12;

        const formatPrice = (price) => price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "&nbsp;₽";

        async function loadCatalog() {
            try {
                const response = await fetch('catalog.csv');
                if (!response.ok) throw new Error('Файл не найден');
                const rows = (await response.text()).split('\n').filter(row => row.trim() !== '');
                
                for (let i = 1; i < rows.length; i++) {
                    let rowStr = rows[i].trim();
                    if (!rowStr) continue;

                    const delimiter = rowStr.includes(';') ? ';' : ',';
                    const regex = new RegExp(`${delimiter}(?=(?:(?:[^"]*"){2})*[^"]*$)`);
                    const values = rowStr.split(regex).map(v => v.replace(/^"|"$/g, '').trim()); 
                    
                    let name = values[0] || '';
                    
                    // Удаляем слово "Apple" в начале названия товара
                    name = name.replace(/^Apple\s+/i, '').trim();

                    let category = values[1] || '';
                    
                    let rawPriceText = values[values.length - 1] || ''; 
                    if (values.length >= 4) rawPriceText = values[3];
                    else if (values.length === 3) rawPriceText = values[2];

                    let numericPrice = parseInt(rawPriceText.replace(/[^0-9]/g, ''), 10) || 0;

                    // Умное извлечение цены, если она "прилипла" к названию
                    const priceInNameMatch = name.match(/(?:\s*-\s*)?([\d\s.,]{4,})(?:₽|р|P|p)?\s*$/i);
                    if (priceInNameMatch && numericPrice === 0) {
                        numericPrice = parseInt(priceInNameMatch[1].replace(/[^0-9]/g, ''), 10);
                        name = name.replace(priceInNameMatch[0], '').trim();
                    }

                    // Пропуск пустых строк и товаров без цены
                    if (!name || name.length < 3 || numericPrice === 0) continue;

                    if (!category || category.toLowerCase() === 'без категории') {
                        const lowName = name.toLowerCase();
                        if (lowName.includes('iphone')) category = 'iPhone';
                        else if (lowName.includes('macbook') || lowName.includes('mac')) category = 'MacBook';
                        else if (lowName.includes('watch')) category = 'Watch';
                        else if (lowName.includes('ipad')) category = 'iPad';
                        else if (lowName.includes('airpods')) category = 'AirPods';
                        else category = 'Аксессуары';
                    }

                    if (numericPrice > 0 && numericPrice % 500 === 0) numericPrice -= 10;
                    
                    allProducts.push({ id: 'prod_' + i, name, category, priceString: "от " + formatPrice(numericPrice), numericPrice });
                }
                window.filterCategory('Все');
            } catch (error) {
                document.getElementById('products-grid').innerHTML = '<p class="text-center text-red-500 w-full col-span-full mt-10">Не удалось загрузить прайс-лист. Проверьте наличие файла catalog.csv.</p>';
            }
        }
        window.addEventListener('DOMContentLoaded', loadCatalog);

        window.handleSearch = function(event) {
            const query = event.target.value.toLowerCase().trim();
            const clearBtn = document.getElementById('clear-search');
            
            if (query.length > 0) { clearBtn.classList.remove('scale-0', 'opacity-0'); clearBtn.classList.add('scale-100', 'opacity-100'); }
            else { clearBtn.classList.remove('scale-100', 'opacity-100'); clearBtn.classList.add('scale-0', 'opacity-0'); }
            
            if (query === '') return window.filterCategory(currentActiveCategory, null, true); 

            filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            
            document.querySelectorAll('.nav-cat-btn').forEach(btn => {
                btn.classList.remove('bg-white/60', 'text-apple-blue', 'shadow-sm'); btn.classList.add('text-apple-dark', 'hover:bg-white/40');
            });
            applySorting();
            currentPage = 1; renderPage();
        };

        window.clearSearch = function() {
            document.getElementById('catalog-search').value = '';
            const clearBtn = document.getElementById('clear-search');
            clearBtn.classList.remove('scale-100', 'opacity-100'); clearBtn.classList.add('scale-0', 'opacity-0');
            window.filterCategory('Все');
        };

        // Обновленная логика фильтрации по категориям
        window.filterCategory = function(categoryName, event, isFromSearch = false) {
            if(event) event.preventDefault();
            if (!isFromSearch) {
                const searchInput = document.getElementById('catalog-search');
                if (searchInput) searchInput.value = '';
                const clearBtn = document.getElementById('clear-search');
                if (clearBtn) { clearBtn.classList.remove('scale-100', 'opacity-100'); clearBtn.classList.add('scale-0', 'opacity-0'); }
            }

            currentActiveCategory = categoryName; currentPage = 1; 
            
            document.querySelectorAll('.nav-cat-btn').forEach(btn => {
                if (btn.dataset.cat === categoryName) {
                    btn.classList.add('bg-white/60', 'text-apple-blue', 'shadow-sm'); btn.classList.remove('text-apple-dark', 'hover:bg-white/40');
                } else {
                    btn.classList.remove('bg-white/60', 'text-apple-blue', 'shadow-sm'); btn.classList.add('text-apple-dark', 'hover:bg-white/40');
                }
            });
            
            // Фильтруем так, чтобы категории точно соответствовали
            filteredProducts = categoryName === 'Все' ? [...allProducts] : allProducts.filter(p => 
                p.category.toLowerCase() === categoryName.toLowerCase() || 
                p.name.toLowerCase().includes(categoryName.toLowerCase())
            );
            
            applySorting();
            renderPage();
        };

        window.sortProducts = function(direction) {
            currentSort = direction;
            const ascBtn = document.getElementById('sort-asc-btn');
            const descBtn = document.getElementById('sort-desc-btn');
            
            ascBtn.classList.remove('bg-white/80', 'text-apple-blue', 'shadow-md');
            descBtn.classList.remove('bg-white/80', 'text-apple-blue', 'shadow-md');
            
            if (direction === 'asc') ascBtn.classList.add('bg-white/80', 'text-apple-blue', 'shadow-md');
            else descBtn.classList.add('bg-white/80', 'text-apple-blue', 'shadow-md');
            
            applySorting();
            currentPage = 1;
            renderPage();
        };

        function applySorting() {
            if (currentSort === 'asc') filteredProducts.sort((a, b) => a.numericPrice - b.numericPrice);
            else if (currentSort === 'desc') filteredProducts.sort((a, b) => b.numericPrice - a.numericPrice);
        }

        function renderPage() {
            const grid = document.getElementById('products-grid'); grid.innerHTML = '';
            const productsToShow = filteredProducts.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            if (productsToShow.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Товары не найдены.</p>`;
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            productsToShow.forEach(product => {
                const safeName = product.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                grid.innerHTML += `
                    <div class="product-card glass rounded-[2rem] p-8 flex flex-col justify-between h-[320px] text-left relative group">
                        <div class="absolute top-4 right-4 bg-white/50 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold text-gray-500 uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-opacity">${product.category}</div>
                        <div><h3 class="text-2xl font-semibold text-apple-dark">${product.name}</h3></div>
                        <div>
                            <p class="text-xl font-medium text-apple-dark mb-4">${product.priceString}</p>
                            <button onclick="window.addToCart('${product.id}', '${safeName}', ${product.numericPrice})" class="w-full py-3.5 liquid-btn-dark rounded-full font-medium transition-all duration-300 hover:scale-105 active:scale-95 shadow-md">В корзину</button>
                        </div>
                    </div>`;
            });
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            const pagContainer = document.getElementById('pagination-container');
            if (totalPages <= 1) return pagContainer.innerHTML = '';
            
            let html = '<div class="flex items-center justify-center gap-3">';
            const btnBase = "w-12 h-12 rounded-full flex items-center justify-center font-medium transition-all duration-300 shadow-sm ";
            
            html += `<button onclick="window.changePage(${currentPage - 1})" class="${btnBase} glass ${currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'hover:scale-110 hover:bg-white'}"><i class="ph ph-caret-left text-lg"></i></button>`;
            
            let start = Math.max(1, currentPage - 2), end = Math.min(totalPages, currentPage + 2);
            if (start > 1) html += `<button onclick="window.changePage(1)" class="${btnBase} glass hover:scale-110 hover:bg-white text-apple-dark">1</button>${start > 2 ? '<span class="px-1 text-gray-400">...</span>' : ''}`;
            
            for (let i = start; i <= end; i++) {
                html += i === currentPage ? `<button class="${btnBase} bg-apple-dark text-white font-bold scale-110 shadow-lg cursor-default">${i}</button>` : `<button onclick="window.changePage(${i})" class="${btnBase} glass hover:scale-110 hover:bg-white text-apple-dark">${i}</button>`;
            }
            
            if (end < totalPages) html += `${end < totalPages - 1 ? '<span class="px-1 text-gray-400">...</span>' : ''}<button onclick="window.changePage(${totalPages})" class="${btnBase} glass hover:scale-110 hover:bg-white text-apple-dark">${totalPages}</button>`;
            
            html += `<button onclick="window.changePage(${currentPage + 1})" class="${btnBase} glass ${currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:scale-110 hover:bg-white'}"><i class="ph ph-caret-right text-lg"></i></button></div>`;
            pagContainer.innerHTML = html;
        }

        window.changePage = function(page) {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page; renderPage();
            window.scrollTo({ top: document.getElementById('products').getBoundingClientRect().top + window.pageYOffset - 80, behavior: "smooth" });
        };

        window.addToCart = function(id, name, price) {
            const item = cart.find(i => i.id === id);
            item ? item.quantity++ : cart.push({ id, name, price, quantity: 1 });
            updateCartUI(); showToast("Добавлено в корзину");
        };

        window.changeQuantity = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) { item.quantity += delta; if (item.quantity <= 0) cart = cart.filter(i => i.id !== id); updateCartUI(); }
        };
        window.removeFromCart = function(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); };

        function updateCartUI() {
            const container = document.getElementById('cart-items'), totalEl = document.getElementById('cart-total'), badge = document.getElementById('cart-badge');
            let count = 0, total = 0;
            cart.forEach(i => { count += i.quantity; total += i.price * i.quantity; });
            
            badge.textContent = count; badge.classList.toggle('opacity-0', count === 0);
            totalEl.innerHTML = formatPrice(total);

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 mt-20"><i class="ph ph-shopping-bag text-6xl mb-4 opacity-50"></i><p class="text-lg text-apple-dark font-medium">Корзина пуста</p></div>`;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center justify-between gap-4 bg-white/60 p-4 rounded-2xl border border-white shadow-sm">
                        <div>
                            <h4 class="text-apple-dark font-semibold text-sm pr-2">${item.name}</h4>
                            <div class="text-apple-blue font-medium text-sm mt-1">${formatPrice(item.price)}</div>
                            <div class="flex items-center gap-3 mt-2 bg-gray-100 rounded-full w-fit px-2 py-1">
                                <button onclick="changeQuantity('${item.id}', -1)" class="w-5 h-5 rounded-full text-gray-600 hover:bg-gray-200">-</button>
                                <span class="text-apple-dark text-xs font-bold w-4 text-center">${item.quantity}</span>
                                <button onclick="changeQuantity('${item.id}', 1)" class="w-5 h-5 rounded-full text-gray-600 hover:bg-gray-200">+</button>
                            </div>
                        </div>
                        <button onclick="removeFromCart('${item.id}')" class="text-gray-400 hover:text-red-500 p-2"><i class="ph ph-trash text-xl"></i></button>
                    </div>`).join('');
            }
        }

        window.toggleCart = function() {
            isCartOpen = !isCartOpen;
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full', !isCartOpen);
            const overlay = document.getElementById('cart-overlay');
            if (isCartOpen) { overlay.classList.remove('hidden'); setTimeout(() => overlay.classList.remove('opacity-0'), 10); document.body.style.overflow = 'hidden'; } 
            else { overlay.classList.add('opacity-0'); setTimeout(() => overlay.classList.add('hidden'), 300); document.body.style.overflow = ''; }
        };

        window.checkout = function() { if (!cart.length) return; cart = []; updateCartUI(); toggleCart(); showToast("Заказ успешно оформлен!"); };

        window.openAuthModal = function(mode = 'login') {
            window.isRegisterMode = mode === 'register';
            document.getElementById('auth-title').textContent = isRegisterMode ? 'Регистрация' : 'Вход в систему';
            document.getElementById('auth-submit-btn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-switch-text').innerHTML = isRegisterMode ? 'Уже есть аккаунт? <button type="button" onclick="openAuthModal(\'login\')" class="text-apple-blue font-semibold hover:underline">Войти</button>' : 'Нет аккаунта? <button type="button" onclick="openAuthModal(\'register\')" class="text-apple-blue font-semibold hover:underline">Зарегистрироваться</button>';
            const modal = document.getElementById('auth-modal'), overlay = document.getElementById('auth-modal-overlay');
            modal.classList.remove('hidden'); overlay.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0', 'scale-95'); overlay.classList.remove('opacity-0'); }, 10);
        };

        window.closeAuthModal = function() {
            const modal = document.getElementById('auth-modal'), overlay = document.getElementById('auth-modal-overlay');
            modal.classList.add('opacity-0', 'scale-95'); overlay.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); overlay.classList.add('hidden'); }, 300);
        };
        window.switchAuthMode = () => openAuthModal(window.isRegisterMode ? 'login' : 'register');

        function updateAuthNav(isAuth, name = '') {
            document.getElementById('auth-nav-container').innerHTML = isAuth ? `<button onclick="openProfileModal()" class="liquid-btn px-4 py-2 rounded-full text-sm font-semibold text-apple-dark shadow-sm flex items-center gap-2"><i class="ph ph-user"></i> ${name.replace('@', '')}</button>` : `<button onclick="openAuthModal('login')" class="liquid-btn px-4 py-2 rounded-full text-sm font-semibold text-apple-dark shadow-sm flex items-center gap-2"><i class="ph ph-user"></i> Войти</button>`;
        }

        window.openProfileModal = function() {
            if (!window.currentUser) return;
            const uData = window.userProfileData || {}, username = uData.username || window.currentUser.email.split('@')[0];
            document.getElementById('profile-name').textContent = username;
            document.getElementById('profile-username').textContent = `@${username}`;
            document.getElementById('profile-email').textContent = window.currentUser.email;
            document.getElementById('profile-avatar').textContent = username.charAt(0).toUpperCase();
            
            const modal = document.getElementById('profile-modal'), overlay = document.getElementById('profile-modal-overlay');
            modal.classList.remove('hidden'); overlay.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0', 'scale-95'); overlay.classList.remove('opacity-0'); }, 10);
        };

        window.closeProfileModal = function() {
            const modal = document.getElementById('profile-modal'), overlay = document.getElementById('profile-modal-overlay');
            modal.classList.add('opacity-0', 'scale-95'); overlay.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); overlay.classList.add('hidden'); }, 300);
        };

        window.showToast = function(msg) {
            const toast = document.getElementById('toast'); document.getElementById('toast-msg').textContent = msg;
            toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
        };

        window.openLinksModal = function() {
            const modal = document.getElementById('links-modal'), overlay = document.getElementById('links-modal-overlay');
            modal.classList.remove('hidden'); overlay.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0', 'scale-95'); overlay.classList.remove('opacity-0'); }, 10); document.body.style.overflow = 'hidden';
        };

        window.closeLinksModal = function() {
            const modal = document.getElementById('links-modal'), overlay = document.getElementById('links-modal-overlay');
            modal.classList.add('opacity-0', 'scale-95'); overlay.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); overlay.classList.add('hidden'); }, 300); document.body.style.overflow = '';
        };
    </script>
